# Continuous integration. Concord supports Windows only, so CI runs on Windows only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (build and test)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: UI tests
        run: npm test

      - name: Type-check the UI
        run: npm run check

      # The Rust app embeds the built UI, so it must exist before cargo runs.
      - name: Build the UI
        run: npm run build

      # Rust is preinstalled on the runner (stable, MSVC toolchain).
      - name: Cache downloaded Rust crates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      # A plain build catches problems the tests hide (e.g. features that only
      # a dev-dependency turns on) and checks the Windows-only code compiles.
      - name: Check the app builds
        working-directory: src-tauri
        run: cargo check --locked

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      # The real Windows Credential Manager, where the login token is stored.
      - name: Windows Credential Manager round trip
        working-directory: src-tauri
        run: cargo test --locked -- --ignored keyring_roundtrip
